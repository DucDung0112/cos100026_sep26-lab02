<h1><strong>Cat Show Registration Page</strong></h1>
<p>
    <label>Owner's Name

    </label>
    </p>
<P>

   <legend>Cat Information Details</legend>
   <p>
    <label>Cat's Name
    <input type=text name="name" maxlength="2" size="10"
    </label>
    </p>
    <p><label>Breed</label></p>
    <select name="breed" id="breed">
        <option value="British Shorthair" selected="selected">Bristish Shorthair</option>

        <option value="Siamese">Siamese</option>
        <option value="Other">Other</option>        
        </select>></option>
    </select>
    <p>
  <label>Date of birth
    <input type="date" name="bday" />
  </label>
</p>
<fieldset>
    <legend>Sex</legend>
    <label for="male">Male</label>
  <input type="radio" id="male" name="sex" value="male">

  <label for="female">female</label>
  <input type="radio" id="female" name="sex" value="female">
  <br><br>
</fieldset>
<fieldset><legend>Competition Categories</legend>
<p>Select which categories your would like your cat entered</p>

<p>

</p>

<p>
  <label for="cutest">Cutest</label>
  <input type="checkbox" id="cutest" name="category" value="cutest">
</p>

<p>
  <label for="ugliest">Ugliest</label>
  <input type="checkbox" id="ugliest" name="category" value="ugliest">
</p>

</fieldset> 
    <p><label>Comments<br/>
<textarea name="comments" rows="4" cols="20"></textarea>
</label></p>
