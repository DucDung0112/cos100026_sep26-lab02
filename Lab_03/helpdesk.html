<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Book a CWA Help Desk appointment">
    <meta name="keywords" content="CWA, help desk, appointment, HTML, form">
    <meta name="author" content="Your Name">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
<img src="images/logo.png" alt="Swinburne University of Technology logo">

  <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
  <p>Check Blackboard for when CWA tutors will be there.</p>

  <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">

    <fieldset>
      <legend>Student details</legend>
      <p>
        <label for="studentid">Student ID</label>
        <input type="text" id="studentid" name="studentid" required="required"
               pattern="\d{7,10}" size="10">
      </p>
      <p>
        <label for="givenname">Given Name</label>
        <input type="text" id="givenname" name="givenname" required="required" maxlength="15" pattern="[A-Za-z]+" size="15">
        <label for="familyname">Family Name</label>
        <input type="text" id="familyname" name="familyname" required="required"maxlength="15" pattern="[A-Za-z]+" size="15">
      </p>
    </fieldset>

    <fieldset>
      <legend>Your unit</legend>
      <p>
        <input type="radio" id="cos10011" name="unit" value="COS10011" required="required">
        <label for="cos10011">COS10011</label>
        <input type="radio" id="cos60004" name="unit" value="COS60004" required="required">
        <label for="cos60004">COS60004</label>
        <input type="radio" id="cos60007" name="unit" value="COS60007" required="required">
        <label for="cos60007">COS60007</label>
      </p>
      <p>
        <label for="tutor">Your Tutor</label>
        <select id="tutor" name="tutor" required="required">
          <option value="">Please Select</option>
          <option value="tutor1">Tutor One</option>
          <option value="tutor2">Tutor Two</option>
          <option value="tutor3">Tutor Three</option>
          <option value="tutor4">Tutor Four</option>
        </select>
      </p>
    </fieldset>

    <fieldset>
      <legend>Issue</legend>
      <p>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="issue[]" value="html" checked="checked">
        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="issue[]" value="css">
        <label for="javascript">JavaScript</label>
        <input type="checkbox" id="javascript" name="issue[]" value="javascript">
        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="issue[]" value="php">
        <label for="mysql">MySQL</label>
        <input type="checkbox" id="mysql" name="issue[]" value="mysql">
      </p>
      <p>
        <label for="description">Description of Issue</label><br>
        <textarea id="description" name="description" rows="5" cols="40"
                  placeholder="Write description of your problem here..."></textarea>
      </p>
    </fieldset>

    <fieldset>
      <legend>Preferred Date / Time</legend>
      <p>
        <label for="date">Date</label>
        <input type="text" id="date" name="date" required="required"
               placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}">
      </p>
      <p>
        <label for="time">Time</label>
        <input type="text" id="time" name="time" required="required"
               placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
      </p>
    </fieldset>

    <p>
      <input type="submit" value="Book">
      <input type="reset" value="Reset form">
    </p>
  </form>
</body>
</html>
